spring.application.name=Recrutement
server.port=8080

# Configuration PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/projetTontonTovo
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=1234

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Delai en jours calendaires, fuseau Indian/Antananarivo
app.conditions.delai-jours=7
app.conditions.publication-active=true

# Documents administratifs : fichiers conserves en base, jamais servis publiquement.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
